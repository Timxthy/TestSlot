name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from the root package.json "packageManager" field
        # (pnpm@9.15.0). Setting it here too makes action-setup error on conflict.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Compliance check (banned phrases)
        run: pnpm check:compliance

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (mock mode)
        # Specs force the Supabase env vars empty, so this runs offline against
        # the seeded mock store — no live DB or secrets needed in CI.
        run: pnpm --filter web test:e2e
