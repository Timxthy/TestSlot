# Netlify config — TestSlot Radar (pnpm + Turborepo monorepo).
#
# Build from the repo ROOT (no `base`): that's where pnpm-lock.yaml and
# pnpm-workspace.yaml live, so Netlify detects pnpm and installs the whole
# workspace (incl. @testslot/shared). We then publish the Next.js output from
# apps/web. An earlier `base = "apps/web"` config broke pnpm detection because
# the lockfile isn't in that subdirectory.

[build]
  command = "pnpm build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  # These are PUBLIC by design: the project URL and publishable (anon) key are
  # safe to expose (protected by RLS) and Next inlines NEXT_PUBLIC_* into the
  # browser bundle. SUPABASE_URL holds the same public project URL as
  # NEXT_PUBLIC_SUPABASE_URL, so the scanner sees it in output too. They're only
  # flagged because they're marked "secret" in the Netlify UI. The one TRUE
  # secret, SUPABASE_SERVICE_ROLE_KEY, is NOT listed here and stays protected
  # (it is read server-side at runtime and never appears in build output).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
